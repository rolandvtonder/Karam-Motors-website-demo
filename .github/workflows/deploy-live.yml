# Builds the site for karammotors.co.za and uploads it to the xneelo web
# server over FTP. Run it by hand: Actions -> "Deploy to karammotors.co.za"
# -> Run workflow.
#
# NOTE (2026-11-10): the xneelo firewall resets FTP data connections from
# GitHub's runners (ECONNRESET), so use scripts/upload-live.ps1 from a PC
# in South Africa instead unless Dewald allows GitHub's IP ranges.
#
# One-time setup: repo Settings -> Secrets and variables -> Actions, add
#   FTP_SERVER    ftp.karammotors.co.za
#   FTP_USERNAME  karamqcvea  (the FTP login, not the domain name)
#   FTP_PASSWORD  (the konsoleH / FTP password)
#
# The xneelo server does not offer FTP over TLS, so this uses plain FTP.
#
# Normally only files this workflow uploaded are replaced or removed. On the
# first run, tick "clear_old_site" to wipe the old WordPress site from the
# web folder before uploading - only after a backup and the client's OK.
name: Deploy to karammotors.co.za

on:
  workflow_dispatch:
    inputs:
      server_dir:
        description: Web folder on the server (must end with /)
        default: public_html/
        required: true
      protocol:
        description: ftp (the server has no TLS) or ftps if that is ever added
        default: ftp
        type: choice
        options: [ftp, ftps]
      clear_old_site:
        description: Delete EVERYTHING in the web folder first (old WordPress site). Only after a backup and the client's OK.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build for the domain root
        run: npm run build
        env:
          BASE_PATH: /

      - name: Upload to the server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ inputs.protocol }}
          local-dir: ./dist/
          server-dir: ${{ inputs.server_dir }}
          dangerous-clean-slate: ${{ inputs.clear_old_site }}
          timeout: 600000
